# Skymoss dedicated server — REFERENCE ONLY.
#
# This file is NOT read by the running server. itzg/minecraft-server generates
# /data/server.properties from environment variables on every boot, so the live
# values live in infra/docker-compose.yml under the `mc` service. A file mounted at
# /config/server.properties is silently ignored, which is exactly how this drifted
# once already — the server ran with motd 'A Minecraft Server' and max-players 20
# while this file said otherwise.
#
# Kept because it documents *why* each value is what it is. Change a value here and
# in docker-compose.yml together.
#
# Tuned for a heavy 244-mod NeoForge pack with Create, Create Aeronautics and
# Valkyrien Skies. Two settings here are load-bearing and should not be reverted
# to vanilla defaults:
#
#   max-tick-time=-1   Disables the watchdog. Modded chunk generation and VS2 physics
#                      routinely exceed the 60s default, and the watchdog responds by
#                      killing the server mid-tick, which risks corrupting the world.
#   allow-flight=true  Required. Riding a VS2 ship or Create contraption reads as
#                      flying to vanilla anticheat, and players get kicked without it.

level-name=FlyMoss
motd=§aSkymoss §7| §f1.21.1 NeoForge

# --- gameplay ---
gamemode=survival
force-gamemode=false
difficulty=normal
hardcore=false
pvp=true
allow-flight=true
allow-nether=true
spawn-monsters=true
spawn-npcs=true
spawn-animals=true

# --- access ---
online-mode=true
white-list=true
enforce-whitelist=true
max-players=10
player-idle-timeout=0
enforce-secure-profile=false

# --- performance ---
# view-distance drives both server CPU and client memory. 8 is a deliberate
# compromise for this pack; Distant Horizons covers the visual gap client-side.
view-distance=8
simulation-distance=6
max-tick-time=-1
network-compression-threshold=256
sync-chunk-writes=false
entity-broadcast-range-percentage=100

# --- world ---
level-seed=
level-type=minecraft\:normal
generate-structures=true
max-world-size=29999984
spawn-protection=0

# --- networking ---
server-port=25565
server-ip=
prevent-proxy-connections=false
use-native-transport=true

# --- rcon: required by the world snapshot script to flush saves safely ---
enable-rcon=true
rcon.port=25575
# rcon.password is injected from the RCON_PASSWORD env var at container start.
broadcast-rcon-to-ops=true

# --- misc ---
enable-command-block=true
op-permission-level=4
function-permission-level=2
enable-status=true
hide-online-players=false
log-ips=true
require-resource-pack=false
