name: Custom fixes

# Builds the three bespoke mods in fixes/.
#
# Two jobs with different purposes:
#   - on a PR touching fixes/, build to catch breakage before merge
#   - on a `custom-fixes-*` tag, build and attach the jars to that release, so the
#     published artifacts come from a reproducible build rather than someone's laptop
#
# The tag pattern deliberately avoids `v*`, which release.yml claims for pack
# releases. Tagging these `v1.0.0` once produced a release containing both the fix
# jars and an auto-built .mrpack.

on:
  push:
    tags: ['custom-fixes-*']
  pull_request:
    paths: ['fixes/**', '.github/workflows/custom-fixes.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'          # NeoForge 1.21.1 requires JDK 21

      - uses: gradle/actions/setup-gradle@v4

      # Every directory under fixes/ is discovered and built by convention, so adding
      # a fix is `mkdir fixes/<name>` and nothing else. Hardcoding a step per mod
      # meant a new one would silently never build — the kind of omission you notice
      # when a player reports a bug that was supposedly fixed.
      #
      #   contains gradlew      -> Gradle project
      #   contains pack.mcmeta  -> data-only mod, jar is a zip of the directory
      #   neither               -> hard error, never a silent skip
      #
      # Output filename comes from `jar-name` if present. That file exists because the
      # manifest pins an exact filename, and those do not always match the directory
      # (KPEnchantFix-neoforge-mod.jar lives in kp-enchant-fix/).
      - name: Build all fixes
        run: |
          set -euo pipefail
          mkdir -p dist
          built=0

          for dir in fixes/*/; do
            name="$(basename "$dir")"

            if [ -f "$dir/gradlew" ]; then
              echo "::group::gradle build — $name"
              chmod +x "$dir/gradlew"
              (cd "$dir" && ./gradlew build --no-daemon)
              echo "::endgroup::"

              # Exclude -sources/-javadoc: a stray sources jar has ended up in this
              # pack before, and shipping one as the mod would be a confusing failure.
              found=$(find "$dir/build/libs" -maxdepth 1 -name '*.jar' \
                        ! -name '*-sources.jar' ! -name '*-javadoc.jar' | wc -l)
              if [ "$found" -eq 0 ]; then
                echo "::error::$name built but produced no jar in build/libs"
                exit 1
              fi
              find "$dir/build/libs" -maxdepth 1 -name '*.jar' \
                ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp {} dist/ \;

            elif [ -f "$dir/pack.mcmeta" ]; then
              jar="$name.jar"
              [ -f "$dir/jar-name" ] && jar="$(tr -d '[:space:]' < "$dir/jar-name")"
              echo "::group::package (data-only) — $name -> $jar"
              (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/dist/$jar" . -x '.*' 'jar-name')
              echo "::endgroup::"

            else
              echo "::error::fixes/$name has neither gradlew nor pack.mcmeta — cannot tell how to build it"
              exit 1
            fi

            built=$((built + 1))
          done

          if [ "$built" -eq 0 ]; then
            echo "::error::no fix directories found under fixes/"
            exit 1
          fi

          echo "built $built fix(es)"
          ls -la dist/

      # The manifest pins each jar by sha512, so a rebuild is a different file even
      # when the source is identical — zip timestamps alone change it. Printing the
      # hashes here removes the manual step of computing them before updating
      # pack/mods/*.pw.toml.
      - name: Report hashes for the manifest
        run: |
          {
            echo "### Built jars"
            echo ""
            echo "Update \`url\` **and** \`hash\` in the matching \`pack/mods/*.pw.toml\`:"
            echo ""
            echo '```'
            for f in dist/*.jar; do
              echo "$(basename "$f")"
              echo "  sha512 = $(sha512sum "$f" | cut -d' ' -f1)"
              echo ""
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: custom-fixes
          path: dist/*.jar

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/custom-fixes-')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          body: |
            Bespoke fixes for bugs in mods this pack depends on. These exist nowhere
            upstream — `fixes/` in this repo is their canonical source.

            Built by CI from the tagged commit.

            > **Do not replace these assets in place.** `pack/mods/*.pw.toml` pins each
            > jar by sha512, so overwriting one breaks every install with a hash
            > mismatch. Publish rebuilds under a new `custom-fixes-*` tag and update
            > both `url` and `hash` in the metafile.

            Per-file hashes are in the workflow run summary.
