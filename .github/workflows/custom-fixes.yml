name: Custom fixes

# Builds the three bespoke mods in fixes/.
#
# Two jobs with different purposes:
#   - on a PR touching fixes/, build to catch breakage before merge
#   - on a `custom-fixes-*` tag, build and attach the jars to that release, so the
#     published artifacts come from a reproducible build rather than someone's laptop
#
# The tag pattern deliberately avoids `v*`, which release.yml claims for pack
# releases. Tagging these `v1.0.0` once produced a release containing both the fix
# jars and an auto-built .mrpack.

on:
  push:
    tags: ['custom-fixes-*']
  pull_request:
    paths: ['fixes/**', '.github/workflows/custom-fixes.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'          # NeoForge 1.21.1 requires JDK 21

      - uses: gradle/actions/setup-gradle@v4

      # Every directory under fixes/ is discovered and built by convention, so adding
      # a fix is `mkdir fixes/<name>` and nothing else. Hardcoding a step per mod
      # meant a new one would silently never build — the kind of omission you notice
      # when a player reports a bug that was supposedly fixed.
      #
      #   contains gradlew      -> Gradle project, Gradle names its own output
      #   contains pack.mcmeta  -> data-only mod, jar is <directory>.jar
      #   neither               -> hard error, never a silent skip
      #
      # Data-only jars take the directory name, with no override mechanism: if you
      # want a different filename, rename the directory. An escape hatch here would
      # only ever be used to keep a name inconsistent with everything around it.
      - name: Build all fixes
        run: |
          set -euo pipefail
          mkdir -p dist
          built=0

          for dir in fixes/*/; do
            name="$(basename "$dir")"

            if [ -f "$dir/gradlew" ]; then
              echo "::group::gradle build — $name"
              chmod +x "$dir/gradlew"
              (cd "$dir" && ./gradlew build --no-daemon)
              echo "::endgroup::"

              # Exclude -sources/-javadoc: a stray sources jar has ended up in this
              # pack before, and shipping one as the mod would be a confusing failure.
              found=$(find "$dir/build/libs" -maxdepth 1 -name '*.jar' \
                        ! -name '*-sources.jar' ! -name '*-javadoc.jar' | wc -l)
              if [ "$found" -eq 0 ]; then
                echo "::error::$name built but produced no jar in build/libs"
                exit 1
              fi
              find "$dir/build/libs" -maxdepth 1 -name '*.jar' \
                ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp {} dist/ \;

            elif [ -f "$dir/pack.mcmeta" ]; then
              echo "::group::package (data-only) — $name -> $name.jar"
              # Deterministic zip. zip embeds file mtimes, and a fresh checkout stamps
              # them with the clone time, so an unchanged source tree would otherwise
              # produce a different jar — and therefore a different sha512 — on every
              # run. Normalising to the DOS epoch (which is what the original jar
              # used) makes a rebuild verifiable against what was published.
              #
              # The Gradle projects already build reproducibly; this brings the
              # data-only path in line.
              find "$dir" -exec touch -t 198002010000 {} +
              (cd "$dir" && TZ=UTC zip -qrX "$GITHUB_WORKSPACE/dist/$name.jar" . -x '.*')
              echo "::endgroup::"

            else
              echo "::error::fixes/$name has neither gradlew nor pack.mcmeta — cannot tell how to build it"
              exit 1
            fi

            built=$((built + 1))
          done

          if [ "$built" -eq 0 ]; then
            echo "::error::no fix directories found under fixes/"
            exit 1
          fi

          echo "built $built fix(es)"
          ls -la dist/

      # Both build paths are reproducible, so a jar built from a given source tree is
      # byte-identical every time. That lets the hash be an INPUT that is committed
      # alongside the source change and verified here, rather than an output someone
      # copies out of a build log into a file afterwards.
      #
      # On a PR the metafile legitimately may not be updated yet, so a mismatch is a
      # notice telling you what to commit. On a tag it is fatal: publishing artifacts
      # the manifest cannot verify would break every install with "Hash invalid!".
      - name: Verify jars match the manifest
        run: |
          set -uo pipefail
          is_tag=false
          [[ "${GITHUB_REF}" == refs/tags/custom-fixes-* ]] && is_tag=true
          mismatch=0

          {
            echo "### Built jars"
            echo ""
            echo "| jar | manifest | sha512 |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for f in dist/*.jar; do
            jar="$(basename "$f")"
            got="$(sha512sum "$f" | cut -d' ' -f1)"
            meta="$(grep -rl "^filename = \"${jar}\"\$" pack/mods/ 2>/dev/null | head -1)"

            if [ -z "$meta" ]; then
              # A new fix before its metafile exists, or a renamed jar.
              echo "| \`$jar\` | not referenced | \`$got\` |" >> "$GITHUB_STEP_SUMMARY"
              echo "::notice::$jar is not referenced by any pack/mods/*.pw.toml yet"
              mismatch=1
              continue
            fi

            want="$(sed -n 's/^hash = "\(.*\)"$/\1/p' "$meta")"
            if [ "$want" = "$got" ]; then
              echo "| \`$jar\` | matches | \`$got\` |" >> "$GITHUB_STEP_SUMMARY"
              echo "  OK        $jar"
            else
              echo "| \`$jar\` | **MISMATCH** | \`$got\` |" >> "$GITHUB_STEP_SUMMARY"
              echo "  MISMATCH  $jar"
              echo "     pinned in $meta: $want"
              echo "     built:                $got"
              mismatch=1
            fi
          done

          if [ "$mismatch" = "1" ]; then
            {
              echo ""
              echo "Set \`hash\` (and \`url\`/\`filename\` if they changed) in the matching"
              echo "\`pack/mods/*.pw.toml\`, run \`node tools/build-index.ts\`, and commit that"
              echo "**in this PR** — then the tag build verifies rather than discovers it."
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "$is_tag" = "true" ]; then
              echo "::error::built jars do not match the hashes pinned in pack/mods/. Update the metafiles, then re-tag."
              exit 1
            fi
            echo "::warning::hashes differ from the manifest — commit the updates before tagging"
          fi

      # A record of what was published, so the release is self-describing without
      # digging through workflow logs.
      - name: Write checksum manifest
        run: (cd dist && sha512sum *.jar > SHA512SUMS.txt && cat SHA512SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: custom-fixes
          path: dist/*.jar

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/custom-fixes-')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.jar
            dist/SHA512SUMS.txt
          body: |
            Bespoke fixes for bugs in mods this pack depends on. These exist nowhere
            upstream — `fixes/` in this repo is their canonical source.

            Built by CI from the tagged commit.

            Every jar here was verified against the sha512 already pinned in
            `pack/mods/*.pw.toml` before publishing — the release cannot contain an
            artifact the pack manifest disagrees with. `SHA512SUMS.txt` records them.

            > **Do not replace these assets in place.** Overwriting one breaks every
            > install with a hash mismatch. Publish rebuilds under a new
            > `custom-fixes-*` tag.
