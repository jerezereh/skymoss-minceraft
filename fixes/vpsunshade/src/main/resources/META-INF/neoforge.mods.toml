modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    authors = "${mod_authors}"
    description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neoforge_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# Both of the following are OPTIONAL on purpose: this mod should load fine (and simply do
# nothing) in any modpack that has only one of the two, or neither. The Java code checks
# ModList.get().isLoaded(...) at runtime before ever touching either mod's classes.

[[dependencies.${mod_id}]]
    modId = "vampirism"
    type = "optional"
    versionRange = "[1.10.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "sable"
    type = "optional"
    versionRange = "[2.0.0,)"
    ordering = "AFTER"
    side = "BOTH"
