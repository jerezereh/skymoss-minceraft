# Skymoss — the whole stack, on one Ubuntu host.
#
#   mc          the dedicated server; installs the pack from the manifest on boot
#   bridge      Discord <-> GitHub relay
#   mirror      Caddy, serving the pack manifest + mod jars over HTTPS
#   cloudflared tunnel providing public HTTPS for the mirror and GitHub webhooks
#
# Nothing here listens on a public port directly except the Minecraft port; the
# tunnel handles ingress for everything HTTP, so the host needs no inbound
# firewall rules for the web services.
#
#   cp .env.example .env   # fill in secrets first
#   docker compose up -d

name: skymoss

# Docker's default json-file driver has NO size cap. A 200-mod server is chatty
# enough to fill /var/lib/docker and wedge the host within weeks, and the failure
# looks like "everything broke at once" rather than anything log-related. Every
# service inherits this.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Minecraft dedicated server
  # ---------------------------------------------------------------------------
  mc:
    image: itzg/minecraft-server:java21
    container_name: skymoss-mc
    logging: *default-logging
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    # This is the one service reachable from the public internet, so it is also the
    # one most worth constraining. Whitelisting blocks *joining*, but the TCP
    # handshake and login-start packets are parsed before that check — meaning 200+
    # third-party mods process bytes from unauthenticated strangers.
    #
    # Capabilities are deliberately NOT dropped: itzg's entrypoint chowns /data and
    # steps down to UID 1000, which needs CHOWN/SETUID/SETGID. Dropping them breaks
    # startup.
    security_opt:
      - no-new-privileges:true
    # A fork bomb from an exploited mod shouldn't be able to take the host down.
    pids_limit: 512
    networks:
      - game
      - packnet
    environment:
      EULA: "TRUE"
      TYPE: NEOFORGE
      VERSION: "${MINECRAFT_VERSION:-1.21.1}"
      NEOFORGE_VERSION: "${NEOFORGE_VERSION:-21.1.241}"

      # The pack installs itself from the manifest. packwiz-installer filters to
      # server-side entries, so client-only mods (sodium, iris, …) never land here.
      #
      # This points at the mirror over the internal compose network, so the pack
      # install needs no public hostname and no domain. Only override it if you are
      # deliberately serving the manifest from somewhere external.
      PACKWIZ_URL: "${PACKWIZ_URL:-http://mirror/pack/pack.toml}"

      MEMORY: "${MC_MEMORY:-8G}"

      # This previously read USE_AIKAR_FLAGS=false with an empty JVM_OPTS, on the
      # assumption that server/jvm.args was being loaded. Nothing reads that file, so
      # the server ran with stock JVM settings and no GC tuning at all — the same
      # failure mode as the ignored /config/server.properties mount.
      #
      # Aikar's flags are the standard G1 baseline for modded servers: they trade a
      # little throughput for much shorter GC pauses, which is what players actually
      # experience as lag spikes. itzg sizes them from MEMORY automatically.
      USE_AIKAR_FLAGS: "true"

      # Extras Aikar's set does not cover. A mixin-heavy pack drives repeated
      # metaspace GCs during mod load at the default size, and failing fast on OOM
      # beats limping along in a death spiral.
      JVM_OPTS: "-XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=512m -XX:+ExitOnOutOfMemoryError -Dfml.readTimeout=180 ${MC_JVM_OPTS:-}"

      # --- server.properties -------------------------------------------------
      # itzg builds /data/server.properties from these env vars on every boot, which
      # is why they are the source of truth rather than a mounted file. A file
      # mounted at /config/server.properties is simply ignored, and with
      # OVERRIDE_SERVER_PROPERTIES=true anything written into /data is replaced with
      # values derived from here — so unset variables silently become stock defaults.
      # Keep these in sync with server/server.properties, which documents the why.
      OVERRIDE_SERVER_PROPERTIES: "true"

      LEVEL: "${WORLD_NAME:-FlyMoss}"
      MOTD: "§aSkymoss §7| §f1.21.1 NeoForge"
      MAX_PLAYERS: "10"
      DIFFICULTY: normal
      MODE: survival
      PVP: "true"
      ONLINE_MODE: "true"
      WHITE_LIST: "true"
      ENFORCE_WHITELIST: "true"
      SPAWN_PROTECTION: "0"
      ENABLE_COMMAND_BLOCK: "true"

      # Load-bearing, not cosmetic:
      #   ALLOW_FLIGHT  riding a Valkyrien Skies ship or a Create contraption reads as
      #                 flying to vanilla anticheat; without this players get kicked.
      #   MAX_TICK_TIME the watchdog kills the server mid-tick during heavy modded
      #                 chunk generation, which risks corrupting the world.
      ALLOW_FLIGHT: "true"
      MAX_TICK_TIME: "-1"

      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      ENFORCE_SECURE_PROFILE: "false"

      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD}"
      RCON_PORT: "25575"

      SETUP_ONLY: "false"
      TZ: "${TZ:-America/Los_Angeles}"
    volumes:
      # No config bind-mounts: itzg reads /data/server.properties, and /config is not
      # consulted at all. server.properties comes from the env vars above; JVM flags
      # come from USE_AIKAR_FLAGS + JVM_OPTS. server/jvm.args and server.properties remain
      # repo as the documented reference for those values.
      - mc-data:/data
    # The pack is fetched from `mirror` during startup, so the mirror must not only
    # be running but actually serving the manifest. Waiting on its healthcheck rather
    # than merely on the container turns "mirror is empty" into a clear unhealthy
    # dependency instead of an opaque packwiz download failure and a crash loop.
    depends_on:
      mirror:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mc-health"]
      # First boot downloads ~400 MB of mods and builds the mod cache; the long
      # start_period stops the healthcheck from flapping the container before
      # the server has ever finished loading.
      start_period: 10m
      interval: 30s
      timeout: 10s
      retries: 5

  # ---------------------------------------------------------------------------
  # Frequent local backups
  # ---------------------------------------------------------------------------
  # restic to Cloudflare R2. Git was the wrong tool for this: every LFS snapshot is
  # a full 158 MB copy, remote LFS objects cannot be pruned without rewriting
  # history, and a binary blob gets none of git's benefits. restic does
  # content-defined chunking, so after the first ~370 MB upload a week of play adds
  # roughly 10-50 MB, and `forget --prune` genuinely reclaims space.
  #
  # It coordinates save-off / save-all / save-on over RCON itself, so a backup can
  # never catch a half-written region file. PAUSE_IF_NO_PLAYERS stops it archiving
  # an idle world over and over.
  mc-backup:
    image: itzg/mc-backup:latest
    container_name: skymoss-backup
    # Pinned deliberately: restic keys snapshots by hostname, and Docker generates a
    # random one per container. Leaving it unset fragments the history into
    # unrelated chains on every recreate, and retention then prunes the wrong things.
    hostname: skymoss
    logging: *default-logging
    restart: unless-stopped
    environment:
      BACKUP_INTERVAL: "${BACKUP_INTERVAL:-1h}"
      INITIAL_DELAY: "5m"
      PAUSE_IF_NO_PLAYERS: "true"

      BACKUP_METHOD: restic
      # S3-compatible endpoint. R2 charges no egress, which matters precisely on the
      # day you actually need a restore.
      RESTIC_REPOSITORY: "${RESTIC_REPOSITORY:?set RESTIC_REPOSITORY}"
      RESTIC_PASSWORD: "${RESTIC_PASSWORD:?set RESTIC_PASSWORD}"
      AWS_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY}"

      # Dense recent history, thinning with age. Unlike LFS, pruning here actually
      # frees storage.
      PRUNE_RESTIC_RETENTION: "${RESTIC_RETENTION:---keep-hourly 24 --keep-daily 14 --keep-weekly 8 --keep-monthly 12}"

      RCON_HOST: mc
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD}"

      # session.lock is per-run state and stale on restore; caches are regenerated.
      #
      # DistantHorizons.sqlite is the big one: a regenerable LOD render cache that
      # was 1.5 GB in the original FlyMoss world — roughly 80% of the save, and
      # four times the size of the actual terrain. Backing it up would turn a
      # ~370 MB snapshot into a ~1.8 GB one for data the client rebuilds anyway.
      EXCLUDES: "*.jar,cache,logs,crash-reports,session.lock,DistantHorizons.sqlite*"
      TZ: "${TZ:-America/Los_Angeles}"
    volumes:
      # Read-only: a backup tool has no business writing to the world.
      - mc-data:/data:ro
      # restic's local cache. Persisted so it isn't rebuilt from the remote on every
      # container recreate, which would mean re-downloading metadata each time.
      - restic-cache:/var/cache/restic
    security_opt:
      - no-new-privileges:true
    networks:
      - game
    depends_on:
      - mc

  # ---------------------------------------------------------------------------
  # Discord <-> GitHub bridge
  # ---------------------------------------------------------------------------
  bridge:
    build:
      context: ../bridge
    container_name: skymoss-bridge
    logging: *default-logging
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_PATH: /data/bridge.db

      DISCORD_TOKEN: "${DISCORD_TOKEN:?set DISCORD_TOKEN}"
      DISCORD_GUILD_ID: "${DISCORD_GUILD_ID:?set DISCORD_GUILD_ID}"
      DISCORD_ISSUE_CHANNEL_ID: "${DISCORD_ISSUE_CHANNEL_ID:?set DISCORD_ISSUE_CHANNEL_ID}"
      DISCORD_CI_CHANNEL_ID: "${DISCORD_CI_CHANNEL_ID:?set DISCORD_CI_CHANNEL_ID}"

      GITHUB_TOKEN: "${GITHUB_TOKEN:?set GITHUB_TOKEN}"
      GITHUB_REPO: "${GITHUB_REPO:-jerezereh/skymoss-minceraft}"

      # Webhooks need a public hostname to deliver to. With no domain, leave this
      # empty — the /webhook/github route then refuses requests rather than
      # accepting unverified ones, and polling below covers GitHub→Discord.
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-}"

      # Seconds between GitHub polls; 0 disables. Safe to run alongside webhooks —
      # message_links dedups whichever path sees an event second.
      GITHUB_POLL_INTERVAL: "${GITHUB_POLL_INTERVAL:-60}"

      CI_EVENT_SECRET: "${CI_EVENT_SECRET:?set CI_EVENT_SECRET}"

      # Bearer token for /alerts. Monitoring tools send unsigned webhooks, so this
      # endpoint uses a token rather than the HMAC scheme used for CI events.
      ALERT_TOKEN: "${ALERT_TOKEN:-}"

      # Server admin commands. RCON is reached over the compose network, so the
      # port is never published to the host.
      RCON_HOST: mc
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD:?set RCON_PASSWORD}"

      # Role allowed to run /restart and /cmd. Unset means nobody can — /cmd is a
      # full server console.
      ADMIN_ROLE_ID: "${ADMIN_ROLE_ID:-}"
    volumes:
      - bridge-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    # On `game` only because it initiates RCON to mc. Docker networks are
    # bidirectional, so mc can still reach this container's port — every endpoint is
    # HMAC- or bearer-authenticated for that reason. Being off `admin` keeps a
    # compromised game server away from Uptime Kuma and the DDNS credentials.
    networks:
      - game
      - admin
    depends_on:
      - mc
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Mod + manifest mirror
  # ---------------------------------------------------------------------------
  # Serves /srv/mirror: the pack manifest and every jar it references. This is what
  # makes the pack survive a mod being deleted upstream — and it is the ONLY source
  # for the three bespoke jars that exist nowhere else.
  mirror:
    image: caddy:2-alpine
    container_name: skymoss-mirror
    logging: *default-logging
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MIRROR_ROOT:-/srv/mirror}:/srv/mirror:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    # Serves read-only static files on an internal network; it never needs to reach
    # anything else, and `packnet` is marked internal so it has no route out.
    networks:
      - packnet
    # Healthy means "actually serving the manifest", not just "Caddy is up" — an empty
    # or unpopulated MIRROR_ROOT is the common first-run mistake, and this catches it
    # here rather than as a mod-download failure inside the Minecraft container.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/pack/pack.toml"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------------
  # Uptime Kuma watches the Minecraft port, the bridge, and the mirror, and posts
  # state changes to the bridge's /alerts endpoint, which renders them into the same
  # Discord channel CI results go to.
  #
  # Deliberately NOT a management panel: Crafty and Pelican want to own the server
  # lifecycle and its files, which would fight the manifest-and-git pipeline (configs
  # are rewritten from the repo on every boot, so panel edits would silently revert).
  # This watches and alerts; /restart and /cmd on the bot cover the control side.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: skymoss-uptime
    logging: *default-logging
    restart: unless-stopped
    # Bound to loopback, not 0.0.0.0: this is an admin UI with no domain in front of
    # it. Reach it over SSH (`ssh -L 3001:localhost:3001 host`) or your tailnet.
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    security_opt:
      - no-new-privileges:true
    networks:
      - admin
      # Needs to reach mc:25565 and mirror to monitor them, but nothing needs to
      # reach it — it is bound to loopback on the host.
      - game
      - packnet
    depends_on:
      - bridge

  # ---------------------------------------------------------------------------
  # Player ingress
  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel cannot carry Minecraft: the protocol is raw TCP, and Cloudflare
  # only proxies arbitrary TCP on the Enterprise-tier Spectrum product. The usual
  # workaround requires every player to run `cloudflared access tcp` locally.
  #
  # This host is NOT behind CGNAT (playit reported client_addr 184.3.244.235, a
  # routable address), so port-forwarding TCP 25565 on the router is available and
  # removes the relay from the path entirely. duckdns keeps a stable hostname
  # pointed at the WAN address so players have a name rather than a changing IP.
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: skymoss-duckdns
    logging: *default-logging
    restart: unless-stopped
    environment:
      SUBDOMAINS: "${DUCKDNS_SUBDOMAIN:?set DUCKDNS_SUBDOMAIN}"
      TOKEN: "${DUCKDNS_TOKEN:?set DUCKDNS_TOKEN}"
      # IPv4 only: this host has no IPv6 route, and publishing a AAAA record that
      # nothing can reach makes clients hang before falling back.
      UPDATE_IP: ipv4
      LOG_FILE: "false"
      TZ: "${TZ:-America/Los_Angeles}"
    security_opt:
      - no-new-privileges:true
    # Holds the DuckDNS token, which can repoint your hostname. Isolated from the
    # internet-facing game server for that reason.
    networks:
      - admin

  # ---------------------------------------------------------------------------
  # playit.gg tunnel (optional fallback)
  # ---------------------------------------------------------------------------
  # Kept for hosts that ARE behind CGNAT, where port forwarding is impossible.
  # Opt in with:  docker compose --profile playit up -d
  #
  # Two traps, both hit during setup:
  #   - SECRET_KEY must be generated on the web first; the container has no
  #     interactive claim flow (the native binary does). An empty value is read as a
  #     bad credential, not as "unclaimed", and the service crash-loops.
  #     https://playit.gg/account/setup/wizard/new-account/docker/docker-name
  #   - 1.0.10 / :latest cannot fall back from IPv6 to IPv4 (upstream #194), so on an
  #     IPv4-only host the relay accepts players and resets them.
  playit:
    profiles: [playit]
    # Pinned, and deliberately NOT :latest.
    #
    # 1.0.10 (== :latest) is broken on IPv4-only hosts: the address selector picks an
    # IPv6 tunnel server, gets NetworkUnreachable, and never falls back to IPv4. The
    # control session then flaps with SessionNotSetup, so the relay accepts players
    # and immediately resets them — upstream issue playit-cloud/playit-agent#194,
    # still open. address_selector.rs last changed 2026-06-07, which ships in 1.0.9
    # and 1.0.10; 1.0.8 predates it and stays on the v1 protocol, so the same secret
    # keeps working. (Do not drop to 0.x — that line cannot authenticate at all.)
    #
    # If 1.0.8 still fails, ladder down via PLAYIT_AGENT_VERSION: 1.0.7, then 1.0.6.
    image: ghcr.io/playit-cloud/playit-agent:${PLAYIT_AGENT_VERSION:-1.0.8}
    container_name: skymoss-playit
    logging: *default-logging
    restart: unless-stopped
    # Host networking so the agent can reach the published Minecraft port on
    # 127.0.0.1 and dial out to playit's relays.
    network_mode: host
    environment:
      SECRET_KEY: "${PLAYIT_SECRET_KEY:-}"
    depends_on:
      - mc

  # ---------------------------------------------------------------------------
  # Public HTTPS ingress (optional)
  # ---------------------------------------------------------------------------
  # Opt-in, because it is only useful if you own a domain on Cloudflare — named
  # tunnel hostnames require a zone, and quick-tunnel URLs change on every restart.
  #
  # Without a domain none of this is needed: the server installs the pack over the
  # internal network, and the bridge polls GitHub instead of receiving webhooks.
  #
  # To enable:  docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: skymoss-tunnel
    logging: *default-logging
    restart: unless-stopped
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    depends_on:
      - mirror
      - bridge
      - uptime-kuma

networks:
  # The internet-facing game server lives here. Kept separate so a compromised
  # Minecraft server — the only thing strangers can send packets to — cannot reach
  # the containers holding GitHub, Discord, and DuckDNS credentials.
  game:

  # Manifest distribution. `internal` means no route to the internet at all: the
  # mirror only ever serves local static files, so it has no reason to egress.
  packnet:
    internal: true

  # Credential-holding services.
  admin:

volumes:
  mc-data:
  bridge-data:
  caddy-data:
  caddy-config:
  uptime-kuma-data:
  restic-cache:
