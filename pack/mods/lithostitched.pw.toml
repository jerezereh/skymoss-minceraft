# side forced to "both". Modrinth reports client_side=unsupported, which the importer
# mapped to "server" — accurate for whether the mod does anything useful alone on a
# client, but wrong for multiplayer. NeoForge compares mod lists on connect, so a mod
# present only on the server gets players rejected with "lithostitched is missing".
#
# It is also genuinely needed client-side for singleplayer, where the integrated
# server runs worldgen. Harmless to install on a client either way.
